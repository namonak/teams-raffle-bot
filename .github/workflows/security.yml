name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '50 17 * * *' # 매일 02:50 KST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical
        # Existing findings are remediated one at a time before this becomes a blocking gate.
        continue-on-error: true

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag teams-raffle-bot:${{ github.sha }} .
      - name: Scan Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: teams-raffle-bot:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
